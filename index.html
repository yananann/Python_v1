<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PythonProject1 | 项目展示页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 全屏背景图 */
            background-image: url("https://picsum.photos/id/1018/1920/1080");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: "Microsoft Yahei", sans‑serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 半透明遮罩，防止背景太亮文字看不清 */
        .mask {
            position: fixed;
            inset: 0;
            background-color: rgba(0,0,0,0.55);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }

        .card {
            background-color: rgba(255,255,255,0.92);
            border-radius: 14px;
            padding: 36px 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 8px;
            font-size:26px;
        }
        .desc {
            text-align:center;
            color:#666;
            margin-bottom:28px;
        }

        .form-item {
            margin-bottom:18px;
        }
        label {
            display:block;
            margin-bottom:6px;
            color:#333;
        }
        input {
            width:100%;
            padding:12px 14px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;
        }
        button {
            width:100%;
            padding:13px;
            background-color:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color:#1d4ed8;
        }

        .link-area {
            margin-top:24px;
            text-align:center;
        }
        a {
            color:#2563eb;
            text-decoration:none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="mask"></div>
    <div class="container">
        <div class="card">
            <h1>PythonProject1</h1>
            <p class="desc">项目演示页面（仅前端静态页面，无后端登录校验）</p>

            <div class="form-item">
                <label>账号</label>
                <input type="text" placeholder="请输入账号">
            </div>
            <div class="form-item">
                <label>密码</label>
                <input type="password" placeholder="请输入密码">
            </div>
            <button>登录</button>

            <div class="link-area">
                <p>源代码仓库：<a target="_blank" href="https://github.com/yananann/Python_v1">GitHub仓库</a></p>
            </div>
        </div>
    </div>
</body>
</html>
