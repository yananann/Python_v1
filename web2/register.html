
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - Python练习项目</title>
    <style>
        /* ========== 全局样式重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ========== 页面整体背景：紫蓝渐变（与登录页完全一致） ========== */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        /* ========== 装饰性背景圆球 ========== */
        .bg-circle {
            position: fixed;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }
        .bg-circle.c1 { width: 300px; height: 300px; top: -100px; left: -100px; }
        .bg-circle.c2 { width: 200px; height: 200px; bottom: -50px; right: -50px; }
        .bg-circle.c3 { width: 150px; height: 150px; top: 50%; right: 10%; }

        /* ========== 注册卡片：毛玻璃效果 ========== */
        .register-card {
            position: relative;
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 35px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            animation: cardIn 0.6s ease-out;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== 卡片顶部 Logo 区域 ========== */
        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-icon svg { width: 36px; height: 36px; }
        .logo-area h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .logo-area p {
            color: rgba(255, 255, 255, 0.75);
            font-size: 14px;
        }

        /* ========== 表单输入组 ========== */
        .form-group {
            margin-bottom: 18px;
            position: relative;
        }
        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper .input-icon {
            position: absolute;
            left: 14px;
            width: 20px;
            height: 20px;
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px 12px 44px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-group input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .form-group input:focus {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.18);
        }
        /* 密码显隐切换按钮 */
        .toggle-pwd {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
            padding: 4px;
            display: flex;
            align-items: center;
        }
        .toggle-pwd:hover { color: #fff; }
        .toggle-pwd svg { width: 20px; height: 20px; }

        /* ========== 密码强度提示 ========== */
        .pwd-strength {
            margin-top: 6px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .strength-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }
        .strength-fill {
            height: 100%;
            width: 0;
            border-radius: 2px;
            transition: all 0.3s ease;
            background: #ff6b6b;
        }
        .strength-fill.weak { width: 33%; background: #ff6b6b; }
        .strength-fill.medium { width: 66%; background: #ff9800; }
        .strength-fill.strong { width: 100%; background: #4caf50; }

        /* ========== 注册按钮 ========== */
        .btn-register {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.55);
        }
        .btn-register:active { transform: translateY(0); }
        .btn-register:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* ========== loading 旋转动画 ========== */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ========== 表单错误抖动动画 ========== */
        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
        .input-error { border-color: #ff6b6b !important; }

        /* ========== 底部登录引导 ========== */
        .footer-link {
            text-align: center;
            margin-top: 22px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }
        .footer-link a {
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            margin-left: 4px;
        }
        .footer-link a:hover { text-decoration: underline; }

        /* ========== Toast 通知 ========== */
        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            min-width: 280px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #333;
            animation: toastIn 0.3s ease-out;
            border-left: 4px solid #667eea;
        }
        .toast.success { border-left-color: #4caf50; }
        .toast.error { border-left-color: #ff6b6b; }
        .toast.warning { border-left-color: #ff9800; }
        .toast svg { width: 20px; height: 20px; flex-shrink: 0; }
        .toast.success svg { color: #4caf50; }
        .toast.error svg { color: #ff6b6b; }
        .toast.warning svg { color: #ff9800; }
        .toast.fade-out { animation: toastOut 0.3s ease-in forwards; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(100%); }
        }

        /* ========== 响应式适配 ========== */
        @media (max-width: 480px) {
            .register-card { padding: 30px 22px; }
            .logo-area h1 { font-size: 20px; }
            .toast-container { top: 12px; right: 12px; left: 12px; }
            .toast { min-width: auto; }
        }
    </style>
</head>
<body>
    <!-- 装饰背景圆球 -->
    <div class="bg-circle c1"></div>
    <div class="bg-circle c2"></div>
    <div class="bg-circle c3"></div>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- 注册卡片 -->
    <div class="register-card" id="registerCard">
        <!-- Logo 区域 -->
        <div class="logo-area">
            <div class="logo-icon">
                <!-- Python 风格蛇形 SVG 图标（与登录页一致） -->
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2C8 2 6 4 6 7v3h6v1H4c-1.1 0-2 .9-2 2v4c0 1.1.9 2 2 2h2v2c0 1.1.9 2 2 2h4c1.1 0 2-.9 2-2v-3c0-1.1-.9-2-2-2H8v-1h8c1.1 0 2-.9 2-2V7c0-3-2-5-6-5z"/>
                    <circle cx="9" cy="6" r="1" fill="white"/>
                    <circle cx="15" cy="18" r="1" fill="white"/>
                </svg>
            </div>
            <h1>创建账户</h1>
            <p>加入 Python 学习之旅</p>
        </div>

        <!-- 注册表单 -->
        <form id="registerForm" autocomplete="off">
            <!-- 用户名输入 -->
            <div class="form-group">
                <label for="username">用户名</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" id="username" name="username" placeholder="3-16位字母或数字" required>
                </div>
            </div>

            <!-- 密码输入 -->
            <div class="form-group">
                <label for="password">密码</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="password" name="password" placeholder="至少6位字符" required>
                    <button type="button" class="toggle-pwd" id="togglePwd" aria-label="显示/隐藏密码">
                        <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <!-- 密码强度条 -->
                <div class="pwd-strength">
                    <span>强度</span>
                    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                    <span id="strengthText">—</span>
                </div>
            </div>

            <!-- 确认密码输入 -->
            <div class="form-group">
                <label for="confirmPassword">确认密码</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 12l2 2 4-4"/>
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="再次输入密码" required>
                </div>
            </div>

            <!-- 注册按钮 -->
            <button type="submit" class="btn-register" id="btnRegister">
                <span id="btnText">注 册</span>
            </button>
        </form>

        <!-- 底部登录引导 -->
        <div class="footer-link">
            已有账户？<a href="index.html">返回登录</a>
        </div>
    </div>

    <script>
        /* ============================================================
         *  注册页核心逻辑
         *  说明：纯前端演示注册，注册成功后保存用户名到 localStorage
         *  并跳转到 index.html 登录页
         * ============================================================ */

        // 获取页面元素
        const registerForm = document.getElementById('registerForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const togglePwdBtn = document.getElementById('togglePwd');
        const eyeIcon = document.getElementById('eyeIcon');
        const btnRegister = document.getElementById('btnRegister');
        const btnText = document.getElementById('btnText');
        const registerCard = document.getElementById('registerCard');
        const toastContainer = document.getElementById('toastContainer');
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');

        /* ---------- 密码显隐切换 ---------- */
        togglePwdBtn.addEventListener('click', function () {
            const isPwd = passwordInput.type === 'password';
            passwordInput.type = isPwd ? 'text' : 'password';
            if (isPwd) {
                eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
            } else {
                eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
            }
        });

        /* ---------- 实时检测密码强度 ---------- */
        passwordInput.addEventListener('input', function () {
            const pwd = passwordInput.value;
            // 清除之前的强度 class
            strengthFill.className = 'strength-fill';
            if (!pwd) {
                strengthText.textContent = '—';
                return;
            }
            // 简单强度判断：长度 + 是否含数字 + 是否含字母
            let score = 0;
            if (pwd.length >= 6) score++;
            if (pwd.length >= 10) score++;
            if (/[0-9]/.test(pwd) && /[a-zA-Z]/.test(pwd)) score++;
            if (/[^a-zA-Z0-9]/.test(pwd)) score++;

            if (score <= 1) {
                strengthFill.classList.add('weak');
                strengthText.textContent = '弱';
            } else if (score <= 2) {
                strengthFill.classList.add('medium');
                strengthText.textContent = '中';
            } else {
                strengthFill.classList.add('strong');
                strengthText.textContent = '强';
            }
        });

        /* ---------- 表单提交：注册逻辑 ---------- */
        registerForm.addEventListener('submit', function (e) {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // 1. 校验用户名：3-16位字母或数字
            if (!/^[a-zA-Z0-9]{3,16}$/.test(username)) {
                showError(usernameInput, '用户名需为3-16位字母或数字');
                return;
            }
            // 2. 校验密码长度
            if (password.length < 6) {
                showError(passwordInput, '密码至少需要6位字符');
                return;
            }
            // 3. 校验两次密码是否一致
            if (password !== confirmPassword) {
                showError(confirmPasswordInput, '两次输入的密码不一致');
                return;
            }

            // 4. 显示 loading
            setLoading(true);

            // 5. 模拟注册请求延迟
            setTimeout(function () {
                // 注册成功：保存用户名到 localStorage（方便登录页自动填充）
                localStorage.setItem('remembered_username', username);
                // 也可以保存注册的账号信息（演示用，实际应存后端）
                const users = JSON.parse(localStorage.getItem('registered_users') || '[]');
                users.push({ username: username, password: password, regTime: new Date().toISOString() });
                localStorage.setItem('registered_users', JSON.stringify(users));

                showToast('注册成功！即将跳转到登录页', 'success');
                setLoading(false);

                // 延迟跳转登录页
                setTimeout(function () {
                    window.location.href = 'index.html';
                }, 800);
            }, 800);
        });

        /* ---------- 输入框错误提示 ---------- */
        function showError(inputEl, message) {
            inputEl.classList.add('input-error');
            registerCard.classList.add('shake');
            showToast(message, 'warning');
            inputEl.focus();
            setTimeout(function () { registerCard.classList.remove('shake'); }, 400);
            inputEl.addEventListener('input', function () {
                inputEl.classList.remove('input-error');
            }, { once: true });
        }

        /* ---------- 按钮 loading 状态切换 ---------- */
        function setLoading(loading) {
            if (loading) {
                btnRegister.disabled = true;
                btnText.innerHTML = '<span class="spinner"></span> 注册中...';
                btnText.style.display = 'flex';
                btnText.style.alignItems = 'center';
                btnText.style.gap = '8px';
            } else {
                btnRegister.disabled = false;
                btnText.textContent = '注 册';
            }
        }

        /* ---------- Toast 通知函数 ---------- */
        function showToast(message, type) {
            type = type || 'info';
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;

            let iconSvg = '';
            if (type === 'success') {
                iconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
            } else if (type === 'error') {
                iconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
            } else if (type === 'warning') {
                iconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
            } else {
                iconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
            }

            toast.innerHTML = iconSvg + '<span>' + message + '</span>';
            toastContainer.appendChild(toast);

            setTimeout(function () {
                toast.classList.add('fade-out');
                setTimeout(function () {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                }, 300);
            }, 3000);
        }
    </script>
</body>
</html>
